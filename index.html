<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Poin - PasirPogorCell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; }
        .card { background: #1a1a1a; border-radius: 1rem; padding: 1rem; margin: 1rem; cursor: pointer; text-align: center; border: 1px solid #22c55e; }
        .poin-modal { background: #111; border: 1px solid #22c55e; border-radius: 1rem; }
        .btn { background: #22c55e; color: black; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; }
    </style>
</head>
<body class="p-8">
    <!-- Tombol Poin -->
    <div class="flex justify-center">
        <button onclick="openPoinModal()" class="card text-2xl">🎁 Poin</button>
    </div>

    <!-- Modal Poin (tersembunyi awal) -->
    <div id="poinModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 z-50">
        <div class="bg-gray-900/95 border border-green-500 rounded-xl w-full max-w-md p-5 transform scale-95 transition-all duration-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-green-400">🎁 Klaim Poin & Reward</h3>
                <button onclick="closePoinModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-1">Tipe ID:</label>
                <div class="flex gap-4">
                    <label><input type="radio" name="tipe" value="phone" checked> 📱 Nomor HP</label>
                    <label><input type="radio" name="tipe" value="game"> 🎮 ID Game</label>
                </div>
            </div>
            <input type="text" id="poinCustomerId" placeholder="Masukkan nomor HP atau ID Game" class="w-full border border-green-400 bg-gray-800 text-white rounded-md p-2 mb-4">
            <button onclick="cekPoin()" class="w-full bg-green-600 hover:bg-green-500 text-black font-bold py-2 rounded-lg">🔍 Cek & Klaim</button>
            <div id="hasilPoin" class="hidden mt-4 text-center text-gray-400">
                (Hasil akan muncul di sini)
            </div>
        </div>
    </div>

    <script>
        function openPoinModal() {
            const modal = document.getElementById('poinModal');
            if (modal) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                const box = modal.querySelector('div');
                if (box) box.classList.remove('scale-95');
                document.getElementById('poinCustomerId').value = '';
                document.getElementById('hasilPoin').classList.add('hidden');
            }
        }
        function closePoinModal() {
            const modal = document.getElementById('poinModal');
            if (modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                const box = modal.querySelector('div');
                if (box) box.classList.add('scale-95');
            }
        }
        function cekPoin() {
            const id = document.getElementById('poinCustomerId').value.trim();
            if (!id) {
                alert('Masukkan ID!');
                return;
            }
            document.getElementById('hasilPoin').innerHTML = `<div class="text-green-400">ID: ${id} - Demo: Anda memiliki 0 poin dan 0 klaim.</div>`;
            document.getElementById('hasilPoin').classList.remove('hidden');
        }
        // Tambahkan event listener untuk radio
        document.querySelectorAll('input[name="tipe"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const input = document.getElementById('poinCustomerId');
                if (this.value === 'phone') input.placeholder = "Masukkan nomor HP (contoh: 081234567890)";
                else input.placeholder = "Masukkan ID Game (contoh: 12345678(1011))";
            });
        });
    </script>
</body>
</html>
