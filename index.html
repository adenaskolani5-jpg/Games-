<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Tajam - GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .photo-wrapper {
            width: 100%;
            background: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        .photo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        .click-hint {
            text-align: center;
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 30px;
            cursor: pointer;
        }
        .modal.active {
            display: flex;
        }
        .modal img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            cursor: default;
        }
        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
        }
        .modal .close-btn:hover {
            transform: rotate(90deg);
        }
        .modal .info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 20px;
        }
        @media (max-width: 600px) {
            body { padding: 15px; }
            .container { padding: 18px; }
            h1 { font-size: 1.3rem; }
            .modal { padding: 15px; }
            .modal .close-btn { top: 10px; right: 18px; font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 Foto Tajam dari GitHub</h1>
    <p class="subtitle">Klik foto untuk melihat versi besar (tanpa kompresi)</p>

    <div class="photo-wrapper" onclick="openModal()">
        <!-- URL RAW dari GitHub Anda -->
        <img 
            src="https://raw.githubusercontent.com/adenaskolani/untuk-menampilkan-foto/main/IMG_20260701_215637.jpg" 
            alt="Foto"
            id="mainPhoto"
        />
    </div>
    <div class="click-hint">
        🖱️ Klik pada foto untuk melihat dalam ukuran penuh
    </div>
</div>

<!-- Modal Fullscreen -->
<div class="modal" id="imageModal" onclick="closeModal(event)">
    <span class="close-btn" onclick="closeModal(event)">×</span>
    <img 
        id="modalImage" 
        src="https://raw.githubusercontent.com/adenaskolani/untuk-menampilkan-foto/main/IMG_20260701_215637.jpg" 
        alt="Foto besar"
        onclick="event.stopPropagation()"
    />
    <span class="info">Klik di luar foto untuk menutup</span>
</div>

<script>
    function openModal() {
        document.getElementById('imageModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('imageModal').classList.remove('active');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('imageModal');
            if (modal.classList.contains('active')) {
                closeModal({ target: modal });
            }
        }
    });
</script>
</body>
</html>
